name: Build and Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Build production site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Verify archive preservation and publication boundaries
        run: bundle exec ruby tools/verify_site.rb
      - name: Verify future posts and pagination
        run: bundle exec ruby tools/test_home.rb
      - name: Check internal links
        run: bundle exec htmlproofer _site --disable-external --no-enforce-https
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
